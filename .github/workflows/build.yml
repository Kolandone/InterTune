name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches:
      - canary
      - main
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone submodules
        run: |
          git clone https://github.com/OuterTune/ffMetadataEx ffMetadataEx
          git -C ffMetadataEx checkout 5374cd8b5eaf603c09ea8199aaf11311a3e60254
          git clone https://github.com/OuterTune/taglib taglib
          git -C taglib checkout abf4cb2e421ff8ca2c97ae899f8dd915e91b5771
          git clone --depth 1 https://github.com/MetrolistGroup/innertubex innertubex

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleCoreDebug --stacktrace -DskipFormatKtlint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InterTune-Aether-debug
          path: app/build/outputs/apk/core/debug/*.apk
