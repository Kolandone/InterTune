name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches:
      - canary
      - main
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone submodules
        run: |
          git clone --depth 1 https://github.com/OuterTune/ffMetadataEx ffMetadataEx
          git clone --depth 1 https://github.com/OuterTune/taglib taglib
          git clone https://github.com/MetrolistGroup/innertubex innertubex
          git -C innertubex checkout b5f8b6f1bc2b73ee9e3f3ac95b7eaa255368864e
          # Fix AGP 8.11 compileSdk syntax in taglib
          python3 -c "
          with open('taglib/build.gradle.kts', 'r') as f:
              content = f.read()
          content = content.replace('compileSdk {\n        version = release(36)\n    }', 'compileSdk = 36')
          content = content.replace('compileSdk {\r\n        version = release(36)\r\n    }', 'compileSdk = 36')
          with open('taglib/build.gradle.kts', 'w') as f:
              f.write(content)
          "

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleCoreDebug --stacktrace -DskipFormatKtlint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InterTune-Aether-debug
          path: app/build/outputs/apk/core/debug/*.apk
