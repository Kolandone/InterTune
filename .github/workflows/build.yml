name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches:
      - canary
      - main
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone submodules
        run: |
          git clone --depth 1 https://github.com/OuterTune/ffMetadataEx ffMetadataEx
          git clone --no-checkout https://github.com/OuterTune/taglib taglib
          git -C taglib fetch origin abf4cb2e421ff8ca2c97ae899f8dd915e91b5771
          git -C taglib checkout abf4cb2e421ff8ca2c97ae899f8dd915e91b5771
          git -C taglib submodule update --init --recursive
          sed -i 's/version = "3.31.6"/version = "4.1.2"/g' taglib/build.gradle.kts
          sed -i '/ndkVersion = "29.0.13113456"/d' taglib/build.gradle.kts
          git clone https://github.com/MetrolistGroup/innertubex innertubex
          git -C innertubex checkout b5f8b6f1bc2b73ee9e3f3ac95b7eaa255368864e

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleCoreDebug --stacktrace -DskipFormatKtlint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InterTune-Aether-debug
          path: app/build/outputs/apk/core/debug/*.apk
