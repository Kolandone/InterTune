name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches:
      - canary
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone submodules
        run: |
          git clone --depth 1 https://github.com/OuterTune/ffMetadataEx ffMetadataEx
          git clone --no-checkout https://github.com/OuterTune/taglib taglib
          git -C taglib fetch origin abf4cb2e421ff8ca2c97ae899f8dd915e91b5771
          git -C taglib checkout abf4cb2e421ff8ca2c97ae899f8dd915e91b5771
          git -C taglib submodule update --init --recursive
          sed -i 's/version = "3.31.6"/version = "4.1.2"/g' taglib/build.gradle.kts
          sed -i '/ndkVersion = "29.0.13113456"/d' taglib/build.gradle.kts
          git clone https://github.com/MetrolistGroup/innertubex innertubex
          git -C innertubex checkout b5f8b6f1bc2b73ee9e3f3ac95b7eaa255368864e

      - name: Fetch Aether v2.4.0 native binaries (aether, lyrebird, psiphon)
        run: |
          set -euo pipefail
          AETHER_VER="v2.4.0"
          fetch_abi() {
            local abi="$1"
            local archive="$2"
            local tmpdir
            tmpdir=$(mktemp -d)
            echo "Downloading $archive for $abi..."
            curl -fsSL "https://github.com/CluvexStudio/Aether/releases/download/${AETHER_VER}/${archive}" -o "$tmpdir/$archive"
            tar -xzf "$tmpdir/$archive" -C "$tmpdir"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp -f "$tmpdir/aether" "app/src/main/jniLibs/$abi/libaether.so"
            chmod 755 "app/src/main/jniLibs/$abi/libaether.so"
            if [ -f "$tmpdir/pt/lyrebird" ]; then
              cp -f "$tmpdir/pt/lyrebird" "app/src/main/jniLibs/$abi/liblyrebird.so"
              chmod 755 "app/src/main/jniLibs/$abi/liblyrebird.so"
            fi
            if [ -f "$tmpdir/pt/psiphon-tunnel-core" ]; then
              cp -f "$tmpdir/pt/psiphon-tunnel-core" "app/src/main/jniLibs/$abi/libpsiphon.so"
              chmod 755 "app/src/main/jniLibs/$abi/libpsiphon.so"
            fi
            rm -rf "$tmpdir"
          }
          fetch_abi "arm64-v8a" "aether-android-arm64.tar.gz"
          fetch_abi "armeabi-v7a" "aether-android-armv7.tar.gz"
          fetch_abi "x86_64" "aether-android-x86_64.tar.gz"
          ls -lh app/src/main/jniLibs/*/lib*.so

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleCoreDebug --stacktrace -DskipFormatKtlint

      - name: Verify split APKs (integrity, signature, Aether binaries, extractNativeLibs)
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/core/debug/*.apk
          AAPT2=$(find /usr/local/lib/android/sdk/build-tools -name aapt2 | sort -V | tail -n 1)
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name apksigner | sort -V | tail -n 1)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            APK=$(ls app/build/outputs/apk/core/debug/*-${abi}-*.apk | head -n 1)
            echo "Inspecting split APK for $abi: $APK"
            ls -lh "$APK"
            unzip -t "$APK" >/dev/null
            "$APKSIGNER" verify --print-certs "$APK"
            unzip -l "$APK" | grep -E "lib/.*\.so"
            unzip -l "$APK" | grep -q "lib/$abi/libaether.so" || { echo "MISSING lib/$abi/libaether.so in $APK"; exit 1; }
            unzip -l "$APK" | grep -q "lib/$abi/liblyrebird.so" || { echo "MISSING lib/$abi/liblyrebird.so in $APK"; exit 1; }
            unzip -l "$APK" | grep -q "lib/$abi/libpsiphon.so" || { echo "MISSING lib/$abi/libpsiphon.so in $APK"; exit 1; }
            for other in arm64-v8a armeabi-v7a x86_64; do
              if [ "$other" != "$abi" ]; then
                if unzip -l "$APK" | grep -q "lib/$other/libaether.so"; then
                  echo "ERROR: $APK unexpectedly contains lib/$other/libaether.so (ABI split failed)"
                  exit 1
                fi
              fi
            done
            "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | grep -i extractNativeLibs
            "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | grep -Eq "extractNativeLibs.*(=true|0xffffffff)" || { echo "ERROR: extractNativeLibs is NOT true in $APK!"; exit 1; }
          done
          echo "ALL SPLIT APK CHECKS PASSED!"

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: InterTune-Aether-arm64-v8a
          path: app/build/outputs/apk/core/debug/*-arm64-v8a-*.apk
          compression-level: 0

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: InterTune-Aether-armeabi-v7a
          path: app/build/outputs/apk/core/debug/*-armeabi-v7a-*.apk
          compression-level: 0

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: InterTune-Aether-x86_64
          path: app/build/outputs/apk/core/debug/*-x86_64-*.apk
          compression-level: 0

      - name: Publish direct APK files to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VER=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${VER}"
          fi
          echo "Publishing release $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/core/debug/*.apk --clobber
          else
            gh release create "$TAG" app/build/outputs/apk/core/debug/*.apk \
              --title "InterTune Aether $TAG" \
              --notes "Built-in Aether v2.4.0 (Gool/MASQUE/WG/MiM/Tor/Psiphon) with persistent signing key for in-place updates. Download the APK matching your phone architecture (arm64-v8a for most modern phones)."
          fi
